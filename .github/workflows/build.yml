name: Build EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace balíčků
        run: pip install -r requirements.txt pyinstaller

      - name: Sestavení exe
        run: pyinstaller --noconfirm --onefile --windowed --name DochazkaMOP --icon="icon.ico" --add-data "icon.ico;." --collect-all ttkbootstrap dochazka_app.py

      - name: Vydání (Release)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DochazkaMOP.exe